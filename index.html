<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Mathesis — Engenharia de Aprendizagem</title>
    <meta name="description" content="Trilha gamificada de matemática básica: módulos com pré-requisitos, prática guiada, verificação de domínio e revisão espaçada." />
    <meta name="theme-color" content="#08090a" />

    <!-- Pré-visualização ao compartilhar o link -->
    <meta property="og:title" content="Mathesis — Engenharia de Aprendizagem" />
    <meta property="og:description" content="Trilha gamificada de matemática com revisão espaçada, XP e desafio final." />
    <meta property="og:type" content="website" />

    <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Cdefs%3E%3ClinearGradient id='g' x1='0' y1='0' x2='1' y2='1'%3E%3Cstop offset='0' stop-color='%23316dca'/%3E%3Cstop offset='1' stop-color='%23c69026'/%3E%3C/linearGradient%3E%3C/defs%3E%3Crect width='32' height='32' rx='8' fill='url(%23g)'/%3E%3Cpath d='M9 22V10l7 8 7-8v12' fill='none' stroke='%23fff' stroke-width='2.6' stroke-linecap='round' stroke-linejoin='round'/%3E%3C/svg%3E" />

    <!-- Fontes -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;700&family=Plus+Jakarta+Sans:wght@400;500;600;800&display=swap" rel="stylesheet" />

    <!-- Estilos -->
    <link rel="stylesheet" href="css/styles.css" />

    <!-- Bibliotecas externas -->
    <script defer src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/confetti.browser.min.js"></script>
    <script id="MathJax-script" async src="https://cdn.jsdelivr.net/npm/mathjax@3.2.2/es5/tex-mml-chtml.js"></script>

    <!-- Aplicação (a ordem importa: dados primeiro, lógica depois) -->
    <script defer src="js/data/modules.js"></script>
    <script defer src="js/data/final-challenge.js"></script>
    <script defer src="js/app.js"></script>
</head>
<body>

    <div class="sidebar-overlay" id="sidebarOverlay"></div>

    <!-- SIDEBAR -->
    <aside class="sidebar" id="sidebar" aria-label="Trilha de módulos">
        <div class="profile-card">
            <div class="brand">
                <svg class="brand-logo" viewBox="0 0 32 32" aria-hidden="true">
                    <defs>
                        <linearGradient id="brandGradient" x1="0" y1="0" x2="1" y2="1">
                            <stop offset="0" stop-color="#316dca" />
                            <stop offset="1" stop-color="#c69026" />
                        </linearGradient>
                    </defs>
                    <rect width="32" height="32" rx="8" fill="url(#brandGradient)" />
                    <path d="M9 22V10l7 8 7-8v12" fill="none" stroke="#fff" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round" />
                </svg>
                <div>
                    <h2>Mathesis</h2>
                    <div class="sub">Engenharia de Aprendizagem</div>
                </div>
            </div>

            <span class="rank-badge" id="user-rank">JUNIOR</span>

            <div class="meter">
                <div class="meter-label">
                    <span>XP</span>
                    <span id="xp-text">0 / 500</span>
                </div>
                <div class="xp-bar-container"><div id="xp-fill"></div></div>
            </div>

            <div class="meter">
                <div class="meter-label">
                    <span>Trilha</span>
                    <span id="trail-text">0/8 · 0%</span>
                </div>
                <div class="trail-segments" id="trail-segments"></div>
            </div>
        </div>

        <nav class="nav-list" id="module-nav"></nav>

        <div class="sidebar-footer">
            <span>Progresso salvo neste navegador</span>
            <button type="button" class="link-btn" id="reset-progress">Reiniciar</button>
        </div>
    </aside>

    <!-- MAIN -->
    <main class="main" id="main">
        <header class="topbar">
            <button type="button" class="menu-toggle" id="menuToggle" aria-label="Abrir menu de módulos" aria-controls="sidebar" aria-expanded="false">☰</button>
            <div class="crumb" id="crumb"></div>

            <div class="hud" aria-label="Seu progresso">
                <div class="hud-item"><span class="label">LVL</span> <span id="hud-lvl">1</span></div>
                <div class="hud-item"><span class="label">SOLVED</span> <span id="hud-solved">0</span>/<span id="hud-total">8</span></div>
                <button type="button" class="hud-item hud-due" id="hud-due-wrap" title="Revisões vencidas" hidden><span class="label">🔁</span> <span id="hud-due">0</span></button>
                <div class="hud-item hud-xp"><span class="label">XP</span> <span id="hud-xp">0</span></div>
            </div>
        </header>

        <div class="content-wrap" id="main-mount">
            <noscript>
                <div class="glass-card is-error">
                    <h2>JavaScript desativado</h2>
                    <p>O Mathesis precisa de JavaScript para funcionar. Ative-o no navegador e recarregue a página.</p>
                </div>
            </noscript>
        </div>
    </main>

    <!-- Notificações -->
    <div class="toast-region" id="toast-region" aria-live="polite"></div>

</body>
</html>
